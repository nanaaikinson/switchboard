# GoReleaser config: archives, SHA256SUMS, .deb/.rpm packages (nfpm) and the
# Homebrew cask.
# Used by .github/workflows/release.yml and `make dist`. Archive names and the
# SHA256SUMS file are what install/install.sh and install.ps1 download; keep them in sync.
version: 2

project_name: switchboard

builds:
  - id: sb
    main: ./cmd/sb
    binary: sb
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # SB_UPDATE_PUBLIC_KEY (a minisign "RW..." key) enables sb self-update;
    # without it the build refuses to self-update. See docs/updates.md.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
      - -X github.com/nanaaikinson/switchboard/internal/update.ReleaseKey={{ index .Env "SB_UPDATE_PUBLIC_KEY" }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: sb
    ids: [sb]
    name_template: "sb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true # sb_<version>_<os>_<arch>/sb(.exe), as install.sh and install.ps1 expect
    files: [none*] # the binary only

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

nfpms:
  - id: packages
    ids: [sb]
    package_name: switchboard
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    bindir: /usr/bin
    homepage: https://github.com/nanaaikinson/switchboard
    maintainer: Nana Kwesi Ofosu-Aikins
    description: |-
      Map local ports to trusted HTTPS names.
      Switchboard routes names such as https://myapp.test to apps on local
      ports, with a local DNS server, a reverse proxy and a name-constrained
      local CA. Run 'sb setup' as your user after installing.
    section: devel
    # No systemd units: 'sb setup' writes them for the user who runs it and
    # 'sb uninstall' removes them, so the package never owns those files.
    scripts:
      postinstall: install/packaging/postinstall.sh
      preremove: install/packaging/preremove.sh
    overrides:
      deb:
        recommends: [libnss3-tools]
      rpm:
        recommends: [nss-tools]

# `brew install nanaaikinson/tap/sb`: a cask with the prebuilt macOS binary.
# Not published for pre-releases (skip_upload: auto), or while the
# HOMEBREW_TAP_TOKEN secret is unset. See docs/releasing.md.
homebrew_casks:
  - name: sb
    ids: [sb]
    binaries: [sb]
    homepage: https://github.com/nanaaikinson/switchboard
    description: Map local ports to trusted HTTPS names
    caveats: "Run 'sb setup' once to set up .test names and trusted HTTPS."
    repository:
      owner: nanaaikinson
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "sb {{ .Tag }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    # The binary isn't notarized yet, so Gatekeeper would block it; brew
    # has already checked the download against the cask's SHA-256.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sb"]
          end

# Release notes, grouped by conventional-commit type. autotag.yml picks the
# version from the same commit types.
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^(docs|chore|ci|test|refactor|style|build)(\(.*\))?:'
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\(.*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.*\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.*\))?:'
      order: 3
    - title: Other
      order: 999

release:
  prerelease: auto
