# GoReleaser config: archives, SHA256SUMS, and .deb/.rpm packages (nfpm).
# Used by .github/workflows/release.yml and `make dist`. Archive names and the
# SHA256SUMS file are what install/install.sh and install.ps1 download; keep them in sync.
version: 2

project_name: switchboard

builds:
  - id: sb
    main: ./cmd/sb
    binary: sb
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # SB_UPDATE_PUBLIC_KEY (a minisign "RW..." key) enables sb self-update;
    # without it the build refuses to self-update. See docs/updates.md.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
      - -X github.com/nanaaikinson/switchboard/internal/update.ReleaseKey={{ index .Env "SB_UPDATE_PUBLIC_KEY" }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: sb
    ids: [sb]
    name_template: "sb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true # sb_<version>_<os>_<arch>/sb(.exe), as install.sh and install.ps1 expect
    files: [none*] # the binary only

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

nfpms:
  - id: packages
    ids: [sb]
    package_name: switchboard
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    bindir: /usr/bin
    homepage: https://github.com/nanaaikinson/switchboard
    maintainer: Nana Kwesi Ofosu-Aikins
    description: |-
      Map local ports to trusted HTTPS names.
      Switchboard routes names such as https://myapp.test to apps on local
      ports, with a local DNS server, a reverse proxy and a name-constrained
      local CA. Run 'sb setup' as your user after installing.
    section: devel
    scripts:
      postinstall: install/packaging/postinstall.sh
      preremove: install/packaging/preremove.sh
    overrides:
      deb:
        recommends: [libnss3-tools]
      rpm:
        recommends: [nss-tools]

changelog:
  use: github-native

release:
  prerelease: auto
