# GoReleaser config: archives, SHA256SUMS, .deb/.rpm packages (nfpm), the
# Homebrew cask and the Scoop manifest.
# Used by .github/workflows/release.yml and `make dist`. Archive names and the
# SHA256SUMS file are what install/install.sh and install.ps1 download; keep them in sync.
version: 2

project_name: switchboard

builds:
  - id: sb
    main: ./cmd/sb
    binary: sb
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # The release key is committed in internal/update/key.go; a set
    # SB_UPDATE_PUBLIC_KEY (a minisign "RW..." key) overrides it, and an unset
    # one leaves it alone. See docs/updates.md.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
      - '{{ with index .Env "SB_UPDATE_PUBLIC_KEY" }}-X github.com/nanaaikinson/switchboard/internal/update.ReleaseKey={{ . }}{{ end }}'
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    # Signs and notarizes the darwin binaries before they're archived, so
    # SHA256SUMS and the cask cover the signed files. A no-op for other
    # targets, and while the macOS signing secrets are unset.
    hooks:
      post:
        - cmd: sh .github/scripts/macos-sign.sh binary {{ .Os }} "{{ .Path }}"
          output: true

archives:
  - id: sb
    ids: [sb]
    name_template: "sb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true # sb_<version>_<os>_<arch>/sb(.exe), as install.sh and install.ps1 expect
    files: [none*] # the binary only

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

nfpms:
  - id: packages
    ids: [sb]
    package_name: switchboard
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    bindir: /usr/bin
    homepage: https://github.com/nanaaikinson/switchboard
    maintainer: Nana Kwesi Ofosu-Aikins
    description: |-
      Map local ports to trusted HTTPS names.
      Switchboard routes names such as https://myapp.test to apps on local
      ports, with a local DNS server, a reverse proxy and a name-constrained
      local CA. Run 'sb setup' as your user after installing.
    section: devel
    # No systemd units: 'sb setup' writes them for the user who runs it and
    # 'sb uninstall' removes them, so the package never owns those files.
    scripts:
      postinstall: install/packaging/postinstall.sh
      preremove: install/packaging/preremove.sh
    overrides:
      deb:
        recommends: [libnss3-tools]
      rpm:
        recommends: [nss-tools]

# `brew install nanaaikinson/tap/sb`: a cask with the prebuilt macOS binary.
# Not published for pre-releases (skip_upload: auto), or while the
# HOMEBREW_TAP_TOKEN secret is unset. See docs/releasing.md.
homebrew_casks:
  - name: sb
    ids: [sb]
    binaries: [sb]
    homepage: https://github.com/nanaaikinson/switchboard
    description: Map local ports to trusted HTTPS names
    caveats: |
      Run 'sb setup' once to set up .test names and trusted HTTPS.
      Run 'sb uninstall' before uninstalling to undo those system changes.
    repository:
      owner: nanaaikinson
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "sb {{ .Tag }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    # The switchboard cask (the tray app) links the same sb.
    conflicts:
      - cask: switchboard
    # An unsigned build (the macOS signing secrets unset) would be blocked
    # by Gatekeeper, so drop its quarantine flag; brew has already checked
    # the download against the cask's SHA-256. Notarized builds keep it.
    hooks:
      post:
        install: |
          {{- if not (index .Env "APPLE_SIGNING_IDENTITY") }}
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sb"]
          end
          {{- end }}

# `scoop bucket add switchboard https://github.com/nanaaikinson/scoop-bucket`,
# then `scoop install switchboard`: the portable sb.exe from the zip. Not
# published for pre-releases, or while SCOOP_BUCKET_TOKEN is unset. winget is
# submitted from the release workflow's windows job instead (wingetcreate).
scoops:
  - name: switchboard
    ids: [sb]
    homepage: https://github.com/nanaaikinson/switchboard
    description: Map local ports to trusted HTTPS names
    license: Proprietary # until the repository has a LICENSE
    directory: bucket
    repository:
      owner: nanaaikinson
      name: scoop-bucket
      token: '{{ index .Env "SCOOP_BUCKET_TOKEN" }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "switchboard {{ .Tag }}"
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}auto{{ else }}true{{ end }}'
    post_install:
      - Write-Host "Run 'sb setup' once to set up .test names and trusted HTTPS."
      - Write-Host "Run 'sb uninstall' before 'scoop uninstall switchboard' to undo those system changes."

# Release notes, grouped by conventional-commit type. autotag.yml picks the
# version from the same commit types.
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^(docs|chore|ci|test|refactor|style|build)(\(.*\))?:'
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\(.*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.*\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.*\))?:'
      order: 3
    - title: Other
      order: 999

release:
  prerelease: auto
