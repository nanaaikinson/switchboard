name: Release

# Runs for a pushed vX.Y.Z tag, and is called by autotag.yml, whose own tag
# pushes can't trigger workflows (GitHub ignores events from GITHUB_TOKEN).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      skip_ci:
        description: the caller already ran CI on this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  # macOS, so GoReleaser's build hook can sign and notarize the darwin sb
  # binaries before they're archived and checksummed; the other targets are
  # cross-compiled as before.
  release:
    needs: ci
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: macos-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign build provenance
      attestations: write # publish build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # GoReleaser builds the changelog from history

      - name: Validate semver tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' is not semver (expected vMAJOR.MINOR.PATCH[-pre][+build])"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A temporary keychain with the Developer ID certificate, and the
      # notary API key; removed by the last step. See docs/releasing.md.
      - name: Set up macOS signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: sh .github/scripts/macos-sign.sh setup

      # Builds the archives, SHA256SUMS and .deb/.rpm packages from
      # .goreleaser.yaml, publishes the GitHub release, and pushes the
      # Homebrew cask and the Scoop manifest. Tags with a pre-release part
      # (v0.2.0-beta.1) are marked as pre-releases and update neither.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          # Public, so a repository variable: enables sb self-update.
          SB_UPDATE_PUBLIC_KEY: ${{ vars.SB_UPDATE_PUBLIC_KEY }}
          # Push access to nanaaikinson/homebrew-tap; unset skips the cask.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Push access to nanaaikinson/scoop-bucket; unset skips Scoop.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # SHA256SUMS.minisig: one signature over every archive's checksum,
      # made with the release key (docs/updates.md). Skipped until it is set.
      - name: Sign SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::notice::MINISIGN_SECRET_KEY is not set; SHA256SUMS is not signed."
            exit 0
          fi
          brew install --quiet minisign
          key=$(mktemp) && trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig -t "switchboard $TAG SHA256SUMS" < /dev/null
          gh release upload "$TAG" dist/SHA256SUMS.minisig --clobber

      # Attestations are unavailable for user-owned private repositories.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip, dist/*.deb, dist/*.rpm"

      - name: Remove the signing keychain
        if: always()
        run: sh .github/scripts/macos-sign.sh cleanup

  # The tray app for macOS: a universal Switchboard.app, signed with the
  # hardened runtime (Entitlements.plist) and notarized and stapled by Tauri,
  # in a .dmg that is signed, notarized and stapled here. Then the
  # `switchboard` Homebrew cask. Without the signing secrets the build is
  # unsigned and the cask isn't published.
  macos:
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: macos-latest
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BUNDLE: src-tauri/target/universal-apple-darwin/release/bundle
    defaults:
      run:
        shell: bash
        working-directory: app/tray
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the sidecar's version comes from git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Before the keychain exists, so npm install scripts never see it.
      - name: Install dependencies
        run: npm ci

      - name: Set up macOS signing
        working-directory: .
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: sh .github/scripts/macos-sign.sh setup

      # Tauri signs the sidecar and the app from the keychain identity
      # (APPLE_SIGNING_IDENTITY), then notarizes the app with notarytool and
      # the API key (APPLE_API_*), and staples it before making the .dmg.
      - name: Build the app
        env:
          # In-app updates: the release key (see docs/updates.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          version=${TAG#v}
          config="{\"version\": \"${version%%-*}\"}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            config="{\"version\": \"${version%%-*}\", \"bundle\": {\"createUpdaterArtifacts\": true}, \"plugins\": {\"updater\": {\"pubkey\": \"$UPDATER_PUBKEY\"}}}"
          fi
          # app gives the updater's .app.tar.gz
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config "$config"

      - name: Sign, notarize and staple the .dmg
        run: |
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::notice::The macOS signing secrets are not set; the .dmg is unsigned."
            exit 0
          fi
          app="$BUNDLE/macos/Switchboard.app"
          dmg=$(echo "$BUNDLE"/dmg/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          sh ../../.github/scripts/macos-sign.sh notarize "$dmg"

          # Check what Gatekeeper will: every executable signed with the
          # hardened runtime, the app's ticket stapled, both accepted.
          codesign --verify --deep --strict --verbose=2 "$app"
          for exe in "$app"/Contents/MacOS/*; do
            codesign -d --verbose=2 "$exe" 2>&1 | grep -q 'flags=.*runtime' ||
              { echo "::error::$exe is not signed with the hardened runtime"; exit 1; }
          done
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Updater bundles and .sig files exist only when the updater key is set.
        run: |
          cd "$BUNDLE"
          shopt -s nullglob
          files=(dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig)
          gh release upload "$TAG" "${files[@]}" --clobber

      # `brew install --cask nanaaikinson/tap/switchboard`. Stable releases
      # only, and only notarized builds: Gatekeeper blocks an unsigned app.
      - name: Publish the switchboard cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN or the macOS signing secrets are not set; skipping the switchboard cask."
            exit 0
          fi
          case "$TAG" in *-*) echo "Pre-release: the cask is not updated."; exit 0 ;; esac
          version=${TAG#v}
          dmg=$(echo "$BUNDLE"/dmg/*.dmg)
          v='#{version}'
          file=$(basename "$dmg")
          file=${file//"$version"/$v} # Switchboard_#{version}_universal.dmg
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          git clone -q "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${OWNER}/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cask="$RUNNER_TEMP/tap/Casks/switchboard.rb"
          cat > "$cask" <<EOF
          # This file is written by the Switchboard release workflow. DO NOT EDIT.
          cask "switchboard" do
            version "$version"
            sha256 "$sha"

            url "https://github.com/$REPO/releases/download/v#{version}/$file"
            name "Switchboard"
            desc "Menu-bar app that maps local ports to trusted HTTPS names"
            homepage "https://github.com/$REPO"

            auto_updates true
            conflicts_with cask: "sb"
            depends_on macos: ">= :ventura"

            app "Switchboard.app"
            binary "#{appdir}/Switchboard.app/Contents/MacOS/sb"

            uninstall quit: "dev.switchboard.tray"

            zap trash: [
              "~/Library/Application Support/dev.switchboard.tray",
              "~/Library/Caches/dev.switchboard.tray",
              "~/Library/LaunchAgents/Switchboard.plist",
              "~/Library/WebKit/dev.switchboard.tray",
            ]

            caveats <<~EOS
              Open Switchboard once to set up .test names and trusted HTTPS.
              Run 'sb uninstall' before uninstalling to undo those system changes.
            EOS
          end
          EOF
          ruby -c "$cask" > /dev/null
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/switchboard.rb
          git commit -q -m "switchboard $TAG" || { echo "The cask is up to date."; exit 0; }
          git push -q

      - name: Remove the signing keychain
        if: always()
        working-directory: .
        run: sh .github/scripts/macos-sign.sh cleanup

  # The tray app for Windows: NSIS + MSI installers, signed (with a timestamp)
  # when the Windows signing secrets are set and checked with signtool before
  # upload. Then the winget PR for sb. Unsigned while the secrets are unset;
  # see docs/releasing.md.
  windows:
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BUNDLE: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
      SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      # winget's validation downloads the zips, so a private repo can't submit.
      WINGET: ${{ secrets.WINGET_TOKEN != '' && !contains(inputs.tag || github.ref_name, '-') && !github.event.repository.private }}
    defaults:
      run:
        shell: bash
        working-directory: app/tray
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the sidecar's version comes from git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # A step of its own, so npm install scripts never see the signing keys.
      - name: Install dependencies
        run: npm ci

      - name: Build the tray app
        env:
          # Windows signing (src-tauri/scripts/sign-windows.ps1).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # In-app updates: the release key (see docs/updates.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          version=${TAG#v}
          # The app version is the release version (MSI needs a plain X.Y.Z).
          config="{\"version\": \"${version%%-*}\"}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            config="{\"version\": \"${version%%-*}\", \"bundle\": {\"createUpdaterArtifacts\": true}, \"plugins\": {\"updater\": {\"pubkey\": \"$UPDATER_PUBKEY\"}}}"
          fi
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config "$config"

      # Everything sign-windows.ps1 signed: a valid Authenticode signature
      # that chains to a trusted root, with a timestamp so it outlives the
      # certificate.
      - name: Verify signatures
        shell: pwsh
        run: |
          if ($env:SIGNED -ne 'true') {
            Write-Host "::notice::WINDOWS_CERTIFICATE is not set; the Windows installers are unsigned."
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found; install the Windows SDK" }
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $files = @("$release/switchboard-tray.exe", "$release/sb.exe") +
            (Get-ChildItem "$env:BUNDLE/nsis/*.exe", "$env:BUNDLE/msi/*.msi").FullName
          foreach ($f in $files) {
            $out = & $signtool.FullName verify /pa /v $f 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Write-Host $out; throw "$f has no valid signature" }
            if ($out -notmatch 'The signature is timestamped') { Write-Host $out; throw "$f is signed but not timestamped" }
            Write-Host "verified: $f"
          }

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Updater bundles and .sig files exist only when the signing key is set.
        run: |
          cd "$BUNDLE"
          shopt -s nullglob
          files=(nsis/*.exe nsis/*.exe.sig msi/*.msi)
          gh release upload "$TAG" "${files[@]}" --clobber

      # `winget install Switchboard.Switchboard`: a PR to microsoft/winget-pkgs
      # with the portable sb.exe from the release zips. Stable releases of a
      # public repository only, while WINGET_TOKEN is set.
      - name: Write the winget manifests
        if: env.WINGET == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -p SHA256SUMS -D winget-sums --clobber
          sh .github/scripts/winget-manifests.sh "$TAG" "${{ github.repository }}" winget-sums/SHA256SUMS winget-manifests
          cat winget-manifests/*

      - name: Submit to winget
        if: env.WINGET == 'true'
        working-directory: .
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP wingetcreate.exe
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile $exe -UseBasicParsing
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "wingetcreate.exe isn't signed by Microsoft ($($sig.Status)); not running it"
          }
          $version = $env:TAG.TrimStart('v')
          & $exe submit --token $env:WINGET_TOKEN --prtitle "New version: Switchboard.Switchboard version $version" winget-manifests
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed with exit code $LASTEXITCODE" }

  # Signs the sb archives, builds the update manifests (checking every
  # signature), and publishes them to the switchboard-updates GitHub Pages
  # repo, which sb self-update and the tray app read. Skipped until the
  # release key and deploy token are configured; see docs/updates.md.
  publish-updates:
    needs: [release, macos, windows]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .minisig files
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      UPDATES_DEPLOY_TOKEN: ${{ secrets.UPDATES_DEPLOY_TOKEN }}
      SB_UPDATE_PUBLIC_KEY: ${{ vars.SB_UPDATE_PUBLIC_KEY }}
      ROLLOUT: ${{ vars.UPDATE_ROLLOUT_PERCENT || '100' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$UPDATES_DEPLOY_TOKEN" ] || [ -z "$SB_UPDATE_PUBLIC_KEY" ]; then
            echo "::notice::Update publishing is not configured (MINISIGN_SECRET_KEY, UPDATES_DEPLOY_TOKEN, SB_UPDATE_PUBLIC_KEY); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        if: steps.cfg.outputs.enabled == 'true'
        with:
          go-version-file: go.mod

      - name: Sign the sb archives
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sudo apt-get install -y -qq minisign
          gh release download "$TAG" -p 'sb_*.tar.gz' -p 'sb_*.zip' -D dist
          key=$(mktemp) && trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in dist/sb_*; do
            base=$(basename "$f")
            platform=$(echo "$base" | sed -E 's/^sb_[^_]+_([a-z0-9]+)_([a-z0-9]+)\..*$/\1-\2/')
            # The trusted comment binds the signature to this version and platform.
            minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "sb $TAG $platform" < /dev/null
          done
          gh release upload "$TAG" dist/*.minisig --clobber

      - name: Build the manifests
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          gh release view "$TAG" --json body -q .body > notes.md
          go run ./cmd/sb-manifest -version "$TAG" -base-url "$base" -rollout "$ROLLOUT" -notes-file notes.md \
            dist/sb_*.tar.gz dist/sb_*.zip > sb.json
          mkdir -p tray
          gh release download "$TAG" -D tray -p '*.app.tar.gz' -p '*.app.tar.gz.sig' -p '*-setup.exe' -p '*-setup.exe.sig' || true
          if ls tray/*.sig > /dev/null 2>&1; then
            go run ./cmd/sb-manifest -tray -version "$TAG" -base-url "$base" -rollout "$ROLLOUT" -notes-file notes.md \
              tray/*.app.tar.gz tray/*-setup.exe > tray.json
          fi

      - name: Publish to switchboard-updates
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          git clone -q "https://x-access-token:${UPDATES_DEPLOY_TOKEN}@github.com/${{ github.repository_owner }}/switchboard-updates.git" updates
          # Pre-releases go to beta; releases to stable, and to beta too, so
          # beta users never lag behind stable.
          case "$TAG" in *-*) channels="beta" ;; *) channels="stable beta" ;; esac
          key=$(mktemp) && trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          pub_date=$(jq -r .pub_date sb.json)
          mkdir -p updates/tray
          for c in $channels; do
            cp sb.json "updates/$c.json"
            # Signed for this channel and date, which sb checks and remembers,
            # then checked exactly as sb will (docs/updates.md).
            minisign -S -s "$key" -m "updates/$c.json" -x "updates/$c.json.minisig" -t "sb-manifest $c $pub_date" < /dev/null
            go run ./cmd/sb-manifest -verify "$c" "updates/$c.json"
            if [ -f tray.json ]; then cp tray.json "updates/tray/$c.json"; fi
          done
          cd updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$TAG: publish to $channels (rollout $ROLLOUT%)" || { echo "Nothing to publish."; exit 0; }
          git push -q

