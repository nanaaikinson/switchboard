name: Release

# Runs for a pushed vX.Y.Z tag, and is called by autotag.yml, whose own tag
# pushes can't trigger workflows (GitHub ignores events from GITHUB_TOKEN).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      skip_ci:
        description: the caller already ran CI on this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign build provenance
      attestations: write # publish build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # GoReleaser builds the changelog from history

      - name: Validate semver tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' is not semver (expected vMAJOR.MINOR.PATCH[-pre][+build])"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Builds the archives, SHA256SUMS and .deb/.rpm packages from
      # .goreleaser.yaml, and publishes the GitHub release. Tags with a
      # pre-release part (v0.2.0-rc.1) are marked as pre-releases.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          # Public, so a repository variable: enables sb self-update.
          SB_UPDATE_PUBLIC_KEY: ${{ vars.SB_UPDATE_PUBLIC_KEY }}

      # Attestations are unavailable for user-owned private repositories.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip, dist/*.deb, dist/*.rpm"

  # The tray app: a .dmg for macOS, and NSIS + MSI installers for Windows,
  # attached to the release GoReleaser created. Signing reads only from
  # repository secrets; without them the builds are unsigned.
  tray:
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg # the .app gives the updater's .app.tar.gz
            dir: src-tauri/target/universal-apple-darwin/release/bundle
            files: dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            files: nsis/*.exe nsis/*.exe.sig msi/*.msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    defaults:
      run:
        shell: bash
        working-directory: app/tray
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the sidecar's version comes from git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build the tray app
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # macOS signing and notarization (tauri reads these directly).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (src-tauri/scripts/sign-windows.ps1).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # In-app updates: the release key (see docs/updates.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          npm ci
          version=${TAG#v}
          # The app version is the release version (MSI needs a plain X.Y.Z).
          config="{\"version\": \"${version%%-*}\"}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            config="{\"version\": \"${version%%-*}\", \"bundle\": {\"createUpdaterArtifacts\": true}, \"plugins\": {\"updater\": {\"pubkey\": \"$UPDATER_PUBKEY\"}}}"
          fi
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "$config"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Updater bundles and .sig files exist only when the signing key is set.
        run: |
          cd "${{ matrix.dir }}"
          shopt -s nullglob
          files=(${{ matrix.files }})
          gh release upload "$TAG" "${files[@]}" --clobber

  # Signs the sb archives, builds the update manifests (checking every
  # signature), and publishes them to the switchboard-updates GitHub Pages
  # repo, which sb self-update and the tray app read. Skipped until the
  # release key and deploy token are configured; see docs/updates.md.
  publish-updates:
    needs: [release, tray]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .minisig files
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      UPDATES_DEPLOY_TOKEN: ${{ secrets.UPDATES_DEPLOY_TOKEN }}
      SB_UPDATE_PUBLIC_KEY: ${{ vars.SB_UPDATE_PUBLIC_KEY }}
      ROLLOUT: ${{ vars.UPDATE_ROLLOUT_PERCENT || '100' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$UPDATES_DEPLOY_TOKEN" ] || [ -z "$SB_UPDATE_PUBLIC_KEY" ]; then
            echo "::notice::Update publishing is not configured (MINISIGN_SECRET_KEY, UPDATES_DEPLOY_TOKEN, SB_UPDATE_PUBLIC_KEY); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        if: steps.cfg.outputs.enabled == 'true'
        with:
          go-version-file: go.mod

      - name: Sign the sb archives
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sudo apt-get install -y -qq minisign
          gh release download "$TAG" -p 'sb_*.tar.gz' -p 'sb_*.zip' -D dist
          key=$(mktemp) && trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in dist/sb_*; do
            base=$(basename "$f")
            platform=$(echo "$base" | sed -E 's/^sb_[^_]+_([a-z0-9]+)_([a-z0-9]+)\..*$/\1-\2/')
            # The trusted comment binds the signature to this version and platform.
            minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "sb $TAG $platform" < /dev/null
          done
          gh release upload "$TAG" dist/*.minisig --clobber

      - name: Build the manifests
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          gh release view "$TAG" --json body -q .body > notes.md
          go run ./cmd/sb-manifest -version "$TAG" -base-url "$base" -rollout "$ROLLOUT" -notes-file notes.md \
            dist/sb_*.tar.gz dist/sb_*.zip > sb.json
          mkdir -p tray
          gh release download "$TAG" -D tray -p '*.app.tar.gz' -p '*.app.tar.gz.sig' -p '*-setup.exe' -p '*-setup.exe.sig' || true
          if ls tray/*.sig > /dev/null 2>&1; then
            go run ./cmd/sb-manifest -tray -version "$TAG" -base-url "$base" -rollout "$ROLLOUT" -notes-file notes.md \
              tray/*.app.tar.gz tray/*-setup.exe > tray.json
          fi

      - name: Publish to switchboard-updates
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          git clone -q "https://x-access-token:${UPDATES_DEPLOY_TOKEN}@github.com/${{ github.repository_owner }}/switchboard-updates.git" updates
          # Pre-releases go to beta; releases to stable, and to beta too, so
          # beta users never lag behind stable.
          case "$TAG" in *-*) channels="beta" ;; *) channels="stable beta" ;; esac
          mkdir -p updates/tray
          for c in $channels; do
            cp sb.json "updates/$c.json"
            if [ -f tray.json ]; then cp tray.json "updates/tray/$c.json"; fi
          done
          cd updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$TAG: publish to $channels (rollout $ROLLOUT%)" || { echo "Nothing to publish."; exit 0; }
          git push -q

