name: CI

# Pushes to main run this through autotag.yml, which releases afterwards.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build (windows)
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck shell scripts
        run: |
          shellcheck --version
          shellcheck --shell=sh --severity=style install/install.sh install/packaging/*.sh test/e2e/linux/*.sh .github/scripts/*.sh test/release/*.sh

      - name: Test the release version script
        run: sh test/release/next-version-test.sh

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ui/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: ui/dashboard/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      # sb embeds the committed dist/, so it must be what the sources build.
      - name: Check the committed build is up to date
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::ui/dashboard/dist is stale; run 'make ui' and commit the result"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::ui/dashboard/dist has new files; run 'make ui' and commit the result"
            exit 1
          fi

      - name: Playwright smoke tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/dashboard/playwright-report

  goreleaser:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  e2e-linux:
    name: e2e (Linux, systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # sb setup, HTTPS to https://probe.test, sb doctor and sb uninstall, as a
      # normal user inside a privileged Ubuntu container that boots systemd;
      # once with systemd-resolved and once with the /etc/hosts fallback.
      - name: End-to-end test
        run: make test-e2e-linux
